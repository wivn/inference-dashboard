<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <title>AWS Inference Dashboard</title>
    <style>
      /* Detect system theme preference */
      :root {
        --loader-bg: #0a0a0f;
        --loader-text: #ffffff;
        --loader-primary: #9333ea;
        --loader-secondary: #0ea5e9;
        --loader-accent: #ec4899;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --loader-bg: #f8fafc;
          --loader-text: #0f172a;
          --loader-primary: #9333ea;
          --loader-secondary: #0ea5e9;
          --loader-accent: #ec4899;
        }
      }

      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--loader-bg);
        color: var(--loader-text);
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }

      #app-loader.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      .loader-logo {
        margin-bottom: 2rem;
        position: relative;
      }

      .loader-icon {
        width: 60px;
        height: 60px;
        position: relative;
      }

      .loader-icon::before,
      .loader-icon::after {
        content: '';
        position: absolute;
        border-radius: 50%;
      }

      .loader-icon::before {
        width: 60px;
        height: 60px;
        border: 3px solid transparent;
        border-top-color: var(--loader-primary);
        border-right-color: var(--loader-secondary);
        animation: spin 0.8s linear infinite;
        will-change: transform;
      }

      .loader-icon::after {
        width: 40px;
        height: 40px;
        top: 10px;
        left: 10px;
        border: 3px solid transparent;
        border-bottom-color: var(--loader-accent);
        border-left-color: var(--loader-secondary);
        animation: spin 1.2s linear infinite reverse;
        will-change: transform;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .loader-title {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(to right, var(--loader-primary), var(--loader-secondary), var(--loader-accent));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 0.5rem;
      }

      .loader-subtitle {
        font-size: 0.875rem;
        opacity: 0.6;
        animation: pulse 1.5s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 0.3; }
      }

      .loader-dots {
        display: inline-flex;
        gap: 4px;
        margin-left: 4px;
      }

      .loader-dots span {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: currentColor;
        animation: dot-pulse 1s ease-in-out infinite;
        will-change: transform, opacity;
      }

      .loader-dots span:nth-child(1) { animation-delay: 0s; }
      .loader-dots span:nth-child(2) { animation-delay: 0.15s; }
      .loader-dots span:nth-child(3) { animation-delay: 0.3s; }

      @keyframes dot-pulse {
        0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
        40% { opacity: 1; transform: scale(1.2); }
      }
    </style>
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="app-loader">
      <div class="loader-logo">
        <div class="loader-icon"></div>
      </div>
      <h1 class="loader-title">AWS Inference Dashboard</h1>
      <div class="loader-subtitle">
        Loading
        <span class="loader-dots">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </div>
    </div>

    <!-- React App Root -->
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>

    <!-- Remove loader when React loads -->
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const loader = document.getElementById('app-loader');
        const root = document.getElementById('root');

        // Watch for React content to appear
        const observer = new MutationObserver(() => {
          if (root && root.children.length > 0) {
            loader.classList.add('fade-out');
            setTimeout(() => {
              loader.remove();
            }, 300);
            observer.disconnect();
          }
        });

        observer.observe(root, { childList: true });

        // Fallback: remove after 5 seconds even if React doesn't load
        setTimeout(() => {
          if (loader && loader.parentNode) {
            loader.classList.add('fade-out');
            setTimeout(() => {
              loader.remove();
            }, 300);
          }
        }, 5000);
      });
    </script>
  </body>
</html>
